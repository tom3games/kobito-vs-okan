<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小人になっておかんと戦え | 体2cmの横スクロール バカゲー</title>
<meta name="description" content="賞味期限切れのヨーグルトで体が2cmに。爪楊枝でおかんに挑む、ダウンロードなしの小人ゲーム。スリッパ、掃除機、猫をかわして、スマホのブラウザで遊べる横スクロールのバカゲー。">
<meta property="og:type" content="website">
<meta property="og:title" content="小人になっておかんと戦え">
<meta property="og:description" content="体2cm。爪楊枝でおかんに挑む横スクロールのボス戦。スリッパを弾き返し、掃除機と猫をかわす。ダウンロードなしで遊べるバカゲー。">
<meta property="og:image" content="https://tom3games.github.io/kobito-vs-okan/og.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://tom3games.github.io/kobito-vs-okan/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#274a7c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=RocknRoll+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script>window.__bootN=0;window.__bootStep=function(){var n=++window.__bootN,b=document.getElementById('bootBar');if(b)b.style.transform='scaleX('+Math.min(1,n/6)+')'}</script>
<link rel="modulepreload" href="vendor/three.core.min.js" onload="__bootStep()">
<link rel="modulepreload" href="vendor/three.module.min.js" onload="__bootStep()">
<link rel="modulepreload" href="js/game.js?v=3" onload="__bootStep()">
<link rel="modulepreload" href="js/stage.js?v=1" onload="__bootStep()">
<link rel="modulepreload" href="shared/sim.js?v=1" onload="__bootStep()">
<link rel="preload" as="image" href="img/mom_search.webp" onload="__bootStep()">
</head>
<body>
<div id="view"></div><div id="flash"></div>
<section id="title" class="hidden">
  <div class="sign"><i></i><i></i><i></i><i></i><h1>小人になって<br>おかんと戦え</h1></div>
  <button id="btnLang"></button>
  <p class="story" id="story"></p>
  <button id="btnStart"></button>
  <p id="credit"></p>
</section>
<section id="hud" class="hidden">
  <div id="plasters"></div>
  <button id="btnMute" aria-label="音"></button>
  <div id="say" class="hidden"></div>
  <div id="cut" class="hidden"><img alt=""></div>
  <div id="edgeL" class="edge hidden"></div><div id="edgeR" class="edge hidden"></div>
  <div id="guide" class="hidden"></div>
  <div id="pad">
    <button id="bL" class="sew" aria-label="左"><svg viewBox="0 0 100 100"><use href="#btn"/><path d="M62 28 L36 50 L62 72" class="st"/></svg></button>
    <button id="bR" class="sew" aria-label="右"><svg viewBox="0 0 100 100"><use href="#btn"/><path d="M38 28 L64 50 L38 72" class="st"/></svg></button>
    <span class="gap"></span>
    <button id="bD" class="sew small" aria-label="ダッシュ"><svg viewBox="0 0 100 100"><use href="#btn"/><path d="M28 30 L48 50 L28 70 M52 30 L72 50 L52 70" class="st"/></svg></button>
    <button id="bJ" class="sew big" aria-label="ジャンプ"><svg viewBox="0 0 100 100"><use href="#btn"/><path d="M28 62 L50 36 L72 62" class="st"/></svg></button>
  </div>
</section>
<section id="result" class="hidden">
  <canvas id="paper" width="720" height="1040"></canvas>
  <div class="res"><button id="btnAgain">もう一回</button><a id="btnPost" target="_blank" rel="noopener">Xでポスト</a></div>
</section>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="btn" viewBox="0 0 100 100"><circle cx="50" cy="52" r="46" fill="#5d3f22" opacity=".45"/><circle cx="50" cy="48" r="46" fill="#efe3c7" stroke="#6d5332" stroke-width="3"/><circle cx="50" cy="48" r="37" fill="#f8f0db" stroke="#c9b48c" stroke-width="2"/></symbol></svg>
<div id="boot">
  <svg viewBox="0 0 200 170" aria-hidden="true">
    <g class="b-shave"><path d="M122 60q18-12 30 2" fill="none" stroke="#d9b57a" stroke-width="4" stroke-linecap="round"/><path d="M128 44q16-8 24 4" fill="none" stroke="#d9b57a" stroke-width="3" stroke-linecap="round"/></g>
    <path d="M28 118 L126 66 L130 74 L34 126Z" fill="#e0bd84" stroke="#5a3d1e" stroke-width="3" stroke-linejoin="round"/><path d="M126 66 L148 56 L130 74Z" fill="#c79a5c" stroke="#5a3d1e" stroke-width="3" stroke-linejoin="round"/>
    <g class="b-knife"><rect x="92" y="28" width="52" height="10" rx="2" fill="#c7ccd0" stroke="#3b3f42" stroke-width="3" transform="rotate(28 118 33)"/><rect x="60" y="8" width="38" height="13" rx="4" fill="#7a4c26" stroke="#3b2a14" stroke-width="3" transform="rotate(28 79 14)"/></g>
    <path d="M36 148h130" stroke="#7a6a42" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <p id="bootMsg">爪楊枝を削っています</p>
  <div class="boot-bar"><i id="bootBar"></i></div>
</div>
<script>
(function(){var o={passive:false};
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},o)});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},o);
var l=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-l<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();l=n},o);
document.addEventListener('dblclick',function(e){e.preventDefault()},o);
window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},o);
try{if((localStorage.getItem('okan_lang')||((navigator.language||'ja').indexOf('ja')==0?'ja':'en'))=='en')document.getElementById('bootMsg').textContent='Sharpening toothpicks'}catch(e){}
setTimeout(function(){window.__bootTimeout=!window.__bootDone;document.getElementById('boot').classList.add('gone')},12000);
var errs=[];window.addEventListener('error',function(e){errs.push(e.message||(e.target&&(e.target.src||e.target.href))||'error')},true);
window.addEventListener('unhandledrejection',function(e){errs.push(String(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(window.__okanReady)return;var d=document.createElement('div');d.id='bootErr';d.textContent='起動できませんでした\n'+errs.join('\n')+'\n'+navigator.userAgent;document.body.appendChild(d)},20000)})();
</script>
<script src="sfx.js?v=1"></script>
<script type="module" src="js/game.js?v=3"></script>
</body>
</html>
